name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      # actions/checkout v6.0.2
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      # actions/setup-python v6.2.0
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.11"

      - name: Install project with dev extras
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Pytest
        run: pytest

  # Multi-capability adapter (per plan §M4a.4): two contracts, two
  # separate conformance runs, two separate signed attestations. Both
  # uploaded as workflow artifacts.
  conformance:
    needs: lint-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with: { path: adapter }

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with: { python-version: "3.11" }

      - name: Install adapter
        run: pip install -e adapter

      - name: Install cosign for adapter
        uses: sigstore/cosign-installer@cad07c2e89fa2edd6e2d7bab4c1aa38e53f76003
        with: { cosign-release: "v3.0.6" }

      # ---- sign.artifact contract ----
      - name: Run conformance — sign.artifact
        id: conformance_sign_artifact
        continue-on-error: true
        uses: wtlinnertz/aieos-governance-foundation/.github/actions/run-conformance@main
        with:
          adapter-id: adapter-cosign-sign
          adapter-version: "1.0.0"
          python-import: "from aieos_adapter_cosign_sign import SignArtifactAdapter as AdapterClass"
          suite-name: sign.artifact-suite
          signing-identity: "https://github.com/${{ github.repository }}/.github/workflows/ci.yml@refs/heads/main"
          output-path: attestation-sign-artifact.json

      - name: Sign sign.artifact attestation (keyless OIDC)
        if: steps.conformance_sign_artifact.outcome == 'success'
        run: cosign sign-blob --bundle attestation-sign-artifact.sigstore.json --yes attestation-sign-artifact.json

      # ---- sign.attestation contract ----
      - name: Run conformance — sign.attestation
        id: conformance_sign_attestation
        continue-on-error: true
        uses: wtlinnertz/aieos-governance-foundation/.github/actions/run-conformance@main
        with:
          adapter-id: adapter-cosign-sign
          adapter-version: "1.0.0"
          python-import: "from aieos_adapter_cosign_sign import SignAttestationAdapter as AdapterClass"
          suite-name: sign.attestation-suite
          signing-identity: "https://github.com/${{ github.repository }}/.github/workflows/ci.yml@refs/heads/main"
          output-path: attestation-sign-attestation.json

      - name: Sign sign.attestation attestation (keyless OIDC)
        if: steps.conformance_sign_attestation.outcome == 'success'
        run: cosign sign-blob --bundle attestation-sign-attestation.sigstore.json --yes attestation-sign-attestation.json

      # ---- upload both attestations as a single artifact bundle ----
      - name: Upload signed attestations
        if: steps.conformance_sign_artifact.outcome == 'success' || steps.conformance_sign_attestation.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: conformance-attestations
          path: |
            attestation-sign-artifact.json
            attestation-sign-artifact.sigstore.json
            attestation-sign-attestation.json
            attestation-sign-attestation.sigstore.json
